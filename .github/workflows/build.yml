name: Build and Package Surya Run

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Build Applet
      run: npm run build

    - name: Archive Production Distribution
      run: |
        cd dist
        zip -r ../surya-run-temple-escape.zip .

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: surya-run-game-dist
        path: surya-run-temple-escape.zip
